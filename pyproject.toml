[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "api-rate-limiter"
version = "0.1.0"
description = "Token-bucket and sliding-window rate limiting for FastAPI with a pluggable backend."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthews Wong" }]
keywords = ["fastapi", "rate-limiting", "token-bucket", "sliding-window", "middleware"]
classifiers = [
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.110",
    "starlette>=0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/matthews-wong"

[tool.setuptools]
packages = ["ratelimiter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
